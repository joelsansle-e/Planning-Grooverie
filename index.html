<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Jam Sessions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderCol: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- En-tête -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Planning des Jam Sessions</h1>
            <p class="text-slate-400 text-sm">Vue centralisée et mise à jour en direct</p>
        </header>

        <!-- Filtres -->
        <div class="bg-cardBg border border-borderCol rounded-xl p-4 md:p-6 mb-6 shadow-lg flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center w-full md:w-auto">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Musicien</label>
                    <select id="filterMusician" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Tous">Tous les musiciens</option>
                        <option value="Nas">Nas</option>
                        <option value="Shan">Shan</option>
                        <option value="Mat">Mat</option>
                        <option value="Flo">Flo</option>
                        <option value="Tony">Tony</option>
                        <option value="Jo">Jo</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Mois</label>
                    <select id="filterMonth" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Tous">Tous les mois</option>
                        <option value="janvier">Janvier</option>
                        <option value="février">Février</option>
                        <option value="mars">Mars</option>
                        <option value="avril">Avril</option>
                        <option value="mai">Mai</option>
                        <option value="juin">Juin</option>
                        <option value="juillet">Juillet</option>
                        <option value="août">Août</option>
                        <option value="septembre">Septembre</option>
                        <option value="octobre">Octobre</option>
                        <option value="novembre">Novembre</option>
                        <option value="décembre">Décembre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Année</label>
                    <select id="filterYear" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Toutes">Toutes les années</option>
                    </select>
                </div>
            </div>
            <div class="w-full md:w-auto flex-1 max-w-xs">
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Recherche</label>
                <input type="text" id="searchInput" placeholder="Filtrer par mot-clé..." class="w-full bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- Tableau des données -->
        <div class="bg-cardBg border border-borderCol rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 border-b border-borderCol text-slate-300 text-xs uppercase tracking-wider text-center">
                            <th class="p-4 font-semibold">Date</th>
                            <th class="p-4 font-semibold">Cachet 1</th>
                            <th class="p-4 font-semibold">Cachet 2</th>
                            <th class="p-4 font-semibold">Chant</th>
                            <th class="p-4 font-semibold">Drums</th>
                            <th class="p-4 font-semibold">Basse</th>
                            <th class="p-4 font-semibold">Clavier</th>
                            <th class="p-4 font-semibold">Commentaires</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-borderCol text-sm text-center">
                        <tr>
                            <td colspan="8" class="p-8 text-slate-400 text-center">Chargement des données du planning...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1EgkCv-Qn9tqAoZNuWedt0P-i3yUZHi_U2iVEV0QIr14/gviz/tq?tqx=out:csv&sheet=Planning_Master";

        let allData = [];

        function getMusicianBadge(name) {
            if (!name || name.trim() === "") return "";
            const cleanName = name.trim().toLowerCase();
            
            let bgClass = "bg-slate-700 text-slate-100";
            if (cleanName.includes("nas")) bgClass = "bg-purple-900 text-purple-20
