<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning OG Jam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderCol: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-darkBg dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans transition-colors duration-200">
    <div class="max-w-6xl mx-auto">
        <!-- En-tête avec bouton thème -->
        <header class="mb-8 relative flex flex-col items-center justify-center">
            <button id="themeToggle" onclick="toggleTheme()" title="Changer de thème" class="fixed top-4 right-4 z-50 p-2.5 rounded-xl bg-white/90 dark:bg-cardBg/90 backdrop-blur-sm border border-slate-300 dark:border-borderCol text-slate-700 dark:text-slate-200 hover:border-indigo-500 transition-colors shadow-lg text-xs font-semibold flex items-center gap-1.5">
                <span id="themeIcon">☀️</span>
                <span id="themeLabel" class="hidden sm:inline">Mode clair</span>
            </button>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-2">Planning OG Jam</h1>
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-borderCol text-slate-600 dark:text-slate-400 text-xs font-semibold tracking-wider">v36</span>
        </header>

        <!-- VUE PRINCIPALE : PLANNING -->
        <div id="planningView">
            <!-- Filtres -->
            <div class="bg-white dark:bg-cardBg border border-slate-200 dark:border-borderCol rounded-xl p-4 md:p-6 mb-4 shadow-lg flex flex-wrap gap-4 items-center justify-between transition-colors">
                <div class="flex flex-wrap gap-4 items-center w-full md:w-auto">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Musicien</label>
                        <select id="filterMusician" class="bg-slate-50 dark:bg-darkBg border border-slate-300 dark:border-borderCol text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Tous">Tous les musiciens</option>
                            <option value="Nas">Nas</option>
                            <option value="Shan">Shan</option>
                            <option value="Mat">Mat</option>
                            <option value="Flo">Flo</option>
                            <option value="Tony">Tony</option>
                            <option value="Jo">Jo</option>
                            <option value="Célia">Célia</option>
                            <option value="Lauralyn">Lauralyn</option>
                            <option value="Rhodes">Rhodes</option>
                            <option value="Félix">Félix</option>
                            <option value="Obed">Obed</option>
                            <option value="PL">PL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Mois</label>
                        <select id="filterMonth" class="bg-slate-50 dark:bg-darkBg border border-slate-300 dark:border-borderCol text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Tous">Tous les mois</option>
                            <option value="01">Janvier</option>
                            <option value="02">Février</option>
                            <option value="03">Mars</option>
                            <option value="04">Avril</option>
                            <option value="05">Mai</option>
                            <option value="06">Juin</option>
                            <option value="07">Juillet</option>
                            <option value="08">Août</option>
                            <option value="09">Septembre</option>
                            <option value="10">Octobre</option>
                            <option value="11">Novembre</option>
                            <option value="12">Décembre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Année</label>
                        <select id="filterYear" class="bg-slate-50 dark:bg-darkBg border border-slate-300 dark:border-borderCol text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Toutes">Toutes les années</option>
                        </select>
                    </div>
                </div>
                <div class="w-full md:w-auto flex-1 max-w-xs">
                    <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Recherche</label>
                    <input type="text" id="searchInput" placeholder="Filtrer par mot-clé..." class="w-full bg-slate-50 dark:bg-darkBg border border-slate-300 dark:border-borderCol text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Compteur dynamique et réinitialisation globale des tris -->
            <div class="mb-3 px-1 flex justify-between items-center text-xs text-slate-500 dark:text-slate-400">
                <span id="sessionCounter">Chargement des sessions...</span>
                <div id="resetSortContainer"></div>
            </div>

            <!-- Tableau des données avec hauteur max et scroll -->
            <div class="bg-white dark:bg-cardBg border border-slate-200 dark:border-borderCol rounded-xl shadow-lg overflow-hidden transition-colors">
                <div class="overflow-x-auto max-h-[75vh] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 z-10">
                            <tr class="bg-slate-200 dark:bg-slate-900 border-b border-slate-300 dark:border-borderCol text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider text-center shadow-md select-none">
                                <th id="th-0" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(0)">Date ↕</th>
                                <th id="th-1" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(1)">Cachet 1 ↕</th>
                                <th id="th-2" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(2)">Cachet 2 ↕</th>
                                <th id="th-3" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(3)">Chant ↕</th>
                                <th id="th-4" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(4)">Drums ↕</th>
                                <th id="th-5" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(5)">Basse ↕</th>
                                <th id="th-6" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(6)">Clavier ↕</th>
                                <th id="th-7" class="p-4 font-semibold bg-slate-200 dark:bg-slate-900 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="toggleSort(7)">Commentaires ↕</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-borderCol/60 text-sm text-center">
                            <tr>
                                <td colspan="8" class="p-8 text-slate-500 dark:text-slate-400 text-center">Chargement des données du planning...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE DÉTAILLÉE D'UNE SESSION -->
        <div id="detailView" class="hidden">
            <div class="mb-6 flex items-center justify-between sticky top-4 z-40">
                <button onclick="closeSessionDetail()" class="px-4 py-2.5 rounded-xl bg-white/90 dark:bg-cardBg/90 backdrop-blur-sm border border-slate-300 dark:border-borderCol text-slate-700 dark:text-slate-200 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors shadow-lg text-sm font-semibold flex items-center gap-2">
                    <span>←</span>
                    <span>Retour au planning</span>
                </button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1EgkCv-Qn9tqAoZNuWedt0P-i3yUZHi_U2iVEV0QIr14/gviz/tq?tqx=out:csv&sheet=Planning_Master";

        let allData = [];
        let currentFilteredData = [];
        let activeSorts = [];

        const colNames = ["Date", "Cachet 1", "Cachet 2", "Chant", "Drums", "Basse", "Clavier", "Commentaires"];

        function initTheme() {
            const savedTheme = localStorage.getItem('ogjam-theme');
            const htmlEl = document.documentElement;
            if (savedTheme === 'light') {
                htmlEl.classList.remove('dark');
                updateThemeButton(false);
            } else {
                htmlEl.classList.add('dark');
                updateThemeButton(true);
            }
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const isDark = htmlEl.classList.toggle('dark');
            localStorage.setItem('ogjam-theme', isDark ? 'dark' : 'light');
            updateThemeButton(isDark);
        }

        function updateThemeButton(isDark) {
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('themeLabel').textContent = isDark ? 'Mode clair' : 'Mode sombre';
        }

        function removeAccents(str) {
            if (!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function parseFormatting(str) {
            if (!str) return "";
            let safe = escapeHTML(str);
            safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-white">$1</strong>');
            safe = safe.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');
            safe = safe.replace(/__(.*?)__/g, '<u class="underline decoration-indigo-400">$1</u>');
            return safe;
        }

        function formatPrettyDate(dateStr) {
            const realDate = parseRealDate(dateStr);
            if (isNaN(realDate.getTime()) || realDate.getTime() === new Date(0).getTime()) {
                return escapeHTML(dateStr);
            }
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let formatted = realDate.toLocaleDateString('fr-FR', options);
            return formatted.charAt(0).toUpperCase() + formatted.slice(1);
        }

        function formatSetlistHTML(rawText) {
            if (!rawText) return "";
            return rawText.split(/\r?\n/).map(line => {
                const trimmed = line.trim();
                if (trimmed === "") {
                    return `<div class="h-3"></div>`;
                }
                if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                    const content = trimmed.replace(/^[•\-]\s*/, '');
                    return `
                        <div class="pl-6 flex items-start gap-2.5 my-1.5">
                            <span class="text-indigo-500 dark:text-indigo-400 font-bold select-none">•</span>
                            <span>${parseFormatting(content)}</span>
                        </div>
                    `;
                }
                if (trimmed.length <= 35 && !trimmed.includes('.')) {
                    return `<div class="font-bold text-slate-900 dark:text-white mt-3 mb-1 text-base md:text-lg">${parseFormatting(trimmed)}</div>`;
                }
                return `<div class="my-1.5 text-slate-700 dark:text-slate-300">${parseFormatting(trimmed)}</div>`;
            }).join('');
        }

        function getMusicianBadge(cellValue, large = false) {
            if (!cellValue || cellValue.trim() === "") return `<span class="text-slate-400 italic text-xs">—</span>`;
            
            const mainNamePart = cellValue.split('(')[0].trim().toLowerCase();
            
            let bgClass = "bg-red-950 text-red-200 border border-red-700";

            if (mainNamePart.includes("nas")) bgClass = "bg-purple-900 text-purple-200 border border-purple-500";
            else if (mainNamePart.includes("shan")) bgClass = "bg-amber-400 text-slate-950 font-bold";
            else if (mainNamePart.includes("mat")) bgClass = "bg-orange-600 text-white font-bold";
            else if (mainNamePart.includes("flo")) bgClass = "bg-cyan-700 text-cyan-100";
            else if (mainNamePart.includes("tony")) bgClass = "bg-rose-700 text-rose-100";
            else if (mainNamePart.includes("jo")) bgClass = "bg-emerald-600 text-emerald-50 font-bold";

            const sizeClass = large ? "px-4 py-2 text-sm md:text-base font-semibold" : "px-2.5 py-1 text-xs";
            return `<span class="${sizeClass} rounded-md inline-block shadow-sm ${bgClass}">${escapeHTML(cellValue)}</span>`;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Erreur de chargement:", error);
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="8" class="p-8 text-rose-500 dark:text-rose-400 text-center">Erreur lors du chargement des données du Google Sheet. Vérifiez le partage public.</td></tr>`;
            }
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !inQuotes) {
                    if (char === '\r') i++;
                    currentRow.push(currentField.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }

            if (rows.length > 1) {
                allData = rows.slice(1).filter(row => row.length >= 8 && row[0] !== "");
                populateYearFilter();
                setDefaultCurrentMonth();
                filterData();
            } else {
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="8" class="p-8 text-slate-500 dark:text-slate-400 text-center">Aucune donnée trouvée dans le tableau.</td></tr>`;
            }
        }

        function populateYearFilter() {
            const years = [...new Set(allData.map(row => {
                const dateVal = row[0];
                const match = dateVal.match(/\b(20\d{2})\b/);
                return match ? match[1] : null;
            }).filter(Boolean))].sort();

            const yearSelect = document.getElementById("filterYear");
            yearSelect.innerHTML = '<option value="Toutes">Toutes les années</option>';
            years.forEach(y => {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            });

            const currentYear = new Date().getFullYear().toString();
            if (years.includes(currentYear)) {
                yearSelect.value = currentYear;
            }
        }

        function setDefaultCurrentMonth() {
            const currentMonthNum = String(new Date().getMonth() + 1).padStart(2, '0');
            const monthSelect = document.getElementById("filterMonth");
            monthSelect.value = currentMonthNum;
        }

        function parseDateInfo(dateStr) {
            if (!dateStr) return { month: "", year: "" };
            
            const yearMatch = dateStr.match(/\b(20\d{2})\b/);
            const year = yearMatch ? yearMatch[1] : "";

            let month = "";
            const monthsMap = {
                "janvier": "01", "février": "02", "fevrier": "02", "mars": "03", 
                "avril": "04", "mai": "05", "juin": "06", "juillet": "07", 
                "août": "08", "aout": "08", "septembre": "09", "octobre": "10", 
                "novembre": "11", "décembre": "12", "decembre": "12"
            };

            const lowerDate = dateStr.toLowerCase();
            for (const [name, num] of Object.entries(monthsMap)) {
                if (lowerDate.includes(name)) {
                    month = num;
                    break;
                }
            }

            if (!month) {
                const parts = dateStr.split(/[\/\-\.]/);
                if (parts.length >= 3) {
                    if (parts[0].length === 4 && parts[1].length <= 2) {
                        month = parts[1].padStart(2, '0');
                    } else if (parts[2].length === 4 && parts[1].length <= 2) {
                        month = parts[1].padStart(2, '0');
                    }
                }
            }

            return { month, year };
        }

        function parseRealDate(dateStr) {
            if (!dateStr) return new Date(0);
            const parts = dateStr.split(/[\/\-\.]/);
            if (parts.length >= 3) {
                if (parts[0].length === 4) {
                    return new Date(parts[0], parts[1] - 1, parts[2]);
                } else {
                    return new Date(parts[2], parts[1] - 1, parts[0]);
                }
            }
            return new Date(0);
        }

        function findNextSessionIndex(data) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let closestIndex = -1;
            let minDiff = Infinity;

            data.forEach((row, index) => {
                const sessionDate = parseRealDate(row[0]);
                const diff = sessionDate - today;
                if (diff >= 0 && diff < minDiff) {
                    minDiff = diff;
                    closestIndex = index;
                }
            });
            return closestIndex;
        }

        function updateCounter(count) {
            const counterEl = document.getElementById("sessionCounter");
            if (count === 0) {
                counterEl.textContent = "Aucune session trouvée";
            } else if (count === 1) {
                counterEl.textContent = "1 session affichée";
            } else {
                counterEl.textContent = `${count} sessions affichées`;
            }
        }

        function updateSortHeaders() {
            for (let i = 0; i < colNames.length; i++) {
                const th = document.getElementById(`th-${i}`);
                const sortIndex = activeSorts.findIndex(s => s.col === i);
                
                if (sortIndex !== -1) {
                    const sortObj = activeSorts[sortIndex];
                    const arrow = sortObj.asc ? '▲' : '▼';
                    const priorityBadge = activeSorts.length > 1 ? `<span class="text-[10px] opacity-75 ml-0.5">${sortIndex + 1}</span>` : '';
                    th.innerHTML = `
                        <span class="inline-flex items-center justify-center gap-1 text-indigo-600 dark:text-indigo-400">
                            <span>${colNames[i]}</span>
                            <span>${arrow}${priorityBadge}</span>
                            <button onclick="removeSort(event, ${i})" title="Annuler le tri sur ${colNames[i]}" class="ml-1 px-1.5 py-0.5 rounded bg-slate-300 dark:bg-slate-800 hover:bg-rose-500 hover:text-white dark:hover:bg-rose-600 text-slate-700 dark:text-slate-300 text-[10px] leading-none transition-colors">✕</button>
                        </span>
                    `;
                } else {
                    th.innerHTML = `<span>${colNames[i]} ↕</span>`;
                }
            }

            const resetContainer = document.getElementById("resetSortContainer");
            if (activeSorts.length > 0) {
                resetContainer.innerHTML = `
                    <button onclick="clearAllSorts()" class="text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1 font-medium">
                        <span>Réinitialiser les tris</span>
                        <span>✕</span>
                    </button>
                `;
            } else {
                resetContainer.innerHTML = "";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            updateCounter(data.length);
            updateSortHeaders();

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-slate-500 dark:text-slate-400 text-center">Aucune session correspondante.</td></tr>`;
                return;
            }

            const nextSessionGlobalIdx = findNextSessionIndex(allData);
            const nextSessionRow = allData[nextSessionGlobalIdx];
            let previousMonth = null;

            tbody.innerHTML = data.map((row, index) => {
                const date = row[0] || "";
                const dateInfo = parseDateInfo(date);
                const monthNum = parseInt(dateInfo.month, 10);
                
                const isEvenMonth = !isNaN(monthNum) && monthNum % 2 === 0;
                let rowBgClass = isEvenMonth 
                    ? "bg-indigo-50/80 dark:bg-indigo-950/35" 
                    : "bg-white dark:bg-slate-800/40";
                
                // Vérifie si la ligne affichée correspond exactement à la vraie prochaine session globale
                const isNext = nextSessionRow && (row[0] === nextSessionRow[0] && row[1] === nextSessionRow[1]);
                if (isNext) {
                    rowBgClass = "bg-indigo-100 dark:bg-indigo-600/30 border-l-4 border-indigo-500 dark:border-indigo-400";
                }

                const isNewMonth = previousMonth !== null && dateInfo.month !== previousMonth;
                const monthBorderClass = isNewMonth ? "border-t-2 border-indigo-300 dark:border-indigo-500/40" : "";
                previousMonth = dateInfo.month;

                let cachet1 = row[1] || "";
                let cachet2 = row[2] || "";
                const net1 = row[8] || ""; 
                const net2 = row[9] || ""; 
                const chant = row[3] || "";
                const drums = row[4] || "";
                const basse = row[5] || "";
                const clavier = row[6] || "";
                let commentaires = row[7] || "/";
                if (commentaires.trim() === "") commentaires = "/";

                if (net1.trim() !== "") cachet1 += ` (${net1})`;
                if (net2.trim() !== "") cachet2 += ` (${net2})`;

                const badgeNext = isNext ? `<span class="mb-1 inline-block px-2 py-0.5 bg-indigo-600 dark:bg-indigo-500 text-white text-[10px] font-bold rounded-full uppercase tracking-wider animate-pulse">Prochaine session</span><br>` : "";

                return `
                    <tr onclick="openSessionDetail(${index})" title="Cliquer pour voir la fiche de la jam" class="${rowBgClass} ${monthBorderClass} cursor-pointer hover:bg-slate-200/80 dark:hover:bg-slate-700/60 transition-colors">
                        <td class="p-4 font-medium text-slate-900 dark:text-white">${badgeNext}${escapeHTML(date)}</td>
                        <td class="p-4">${getMusicianBadge(cachet1)}</td>
                        <td class="p-4">${getMusicianBadge(cachet2)}</td>
                        <td class="p-4 text-slate-700 dark:text-slate-300">${escapeHTML(chant)}</td>
                        <td class="p-4 text-slate-700 dark:text-slate-300">${escapeHTML(drums)}</td>
                        <td class="p-4 text-slate-700 dark:text-slate-300">${escapeHTML(basse)}</td>
                        <td class="p-4 text-slate-700 dark:text-slate-300">${escapeHTML(clavier)}</td>
                        <td class="p-4 text-slate-500 dark:text-slate-400 italic">${escapeHTML(commentaires)}</td>
                    </tr>
                `;
            }).join('');
        }

        function openSessionDetail(index) {
            const row = currentFilteredData[index];
            if (!row) return;

            // Vérifie si la session cliquée est bien la vraie prochaine session globale
            const nextSessionGlobalIdx = findNextSessionIndex(allData);
            const nextSessionRow = allData[nextSessionGlobalIdx];
            const isNext = nextSessionRow && (row[0] === nextSessionRow[0] && row[1] === nextSessionRow[1]);

            const rawDate = row[0] || "";
            const prettyDate = formatPrettyDate(rawDate);
            
            let cachet1 = row[1] || "";
            let cachet2 = row[2] || "";
            const net1 = row[8] || "";
            const net2 = row[9] || "";
            const chant = row[3] || "—";
            const drums = row[4] || "—";
            const basse = row[5] || "—";
            const clavier = row[6] || "—";
            const commentaires = row[7] ? row[7].trim() : "";
            const setlist = row[10] ? row[10].trim() : "";

            if (net1.trim() !== "") cachet1 += ` (${net1})`;
            if (net2.trim() !== "") cachet2 += ` (${net2})`;

            const badgeNext = isNext 
                ? `<span class="inline-block px-3 py-1 bg-indigo-600 dark:bg-indigo-500 text-white text-xs font-bold rounded-full uppercase tracking-wider mb-2">Prochaine session</span><br>` 
                : "";

            const commentairesHtml = (commentaires && commentaires !== "/") ? `
                <div class="bg-amber-50/80 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-800/40 rounded-xl p-6 mb-8">
                    <h3 class="text-sm md:text-base font-extrabold uppercase tracking-wider text-amber-800 dark:text-amber-300 mb-3">Commentaires</h3>
                    <p class="text-base text-slate-800 dark:text-slate-200 whitespace-pre-line leading-relaxed">${parseFormatting(commentaires)}</p>
                </div>
            ` : "";

            const setlistHtml = setlist ? `
                <div class="bg-slate-50 dark:bg-darkBg/60 border border-slate-200 dark:border-borderCol rounded-xl p-6 md:p-8">
                    <h3 class="text-sm md:text-base font-extrabold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-4">Setlist & Déroulé</h3>
                    <div class="text-base md:text-lg text-slate-800 dark:text-slate-200 leading-relaxed font-normal">${formatSetlistHTML(setlist)}</div>
                </div>
            ` : `
                <div class="bg-slate-50 dark:bg-darkBg/40 border border-dashed border-slate-300 dark:border-borderCol rounded-xl p-8 text-center">
                    <h3 class="text-sm md:text-base font-extrabold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">Setlist & Déroulé</h3>
                    <p class="text-base text-slate-500 dark:text-slate-400 italic">Aucune setlist renseignée pour cette session.</p>
                </div>
            `;

            document.getElementById("detailContent").innerHTML = `
                <div class="bg-white dark:bg-cardBg border border-slate-200 dark:border-borderCol rounded-2xl p-6 md:p-10 shadow-xl transition-colors">
                    <!-- En-tête de la fiche centré -->
                    <div class="border-b border-slate-200 dark:border-borderCol pb-6 mb-8 text-center">
                        ${badgeNext}
                        <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white capitalize">${prettyDate}</h2>
                    </div>

                    <!-- Grille de l'équipe (2 étages : Cachets en haut, Reste en dessous) -->
                    <div class="mb-8">
                        <h3 class="text-sm md:text-base font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">Équipe & Line-up</h3>
                        
                        <!-- 1er étage : Cachet 1 & Cachet 2 -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70 flex flex-col justify-between">
                                <span class="text-xs font-semibold uppercase text-slate-400 mb-2">Cachet 1</span>
                                <div>${getMusicianBadge(cachet1, true)}</div>
                            </div>
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70 flex flex-col justify-between">
                                <span class="text-xs font-semibold uppercase text-slate-400 mb-2">Cachet 2</span>
                                <div>${getMusicianBadge(cachet2, true)}</div>
                            </div>
                        </div>

                        <!-- 2ème étage : Chant, Drums, Basse, Clavier -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70">
                                <span class="block text-xs font-semibold uppercase text-slate-400 mb-1">Chant</span>
                                <span class="text-base md:text-lg font-bold text-slate-900 dark:text-white">${escapeHTML(chant)}</span>
                            </div>
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70">
                                <span class="block text-xs font-semibold uppercase text-slate-400 mb-1">Drums</span>
                                <span class="text-base md:text-lg font-bold text-slate-900 dark:text-white">${escapeHTML(drums)}</span>
                            </div>
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70">
                                <span class="block text-xs font-semibold uppercase text-slate-400 mb-1">Basse</span>
                                <span class="text-base md:text-lg font-bold text-slate-900 dark:text-white">${escapeHTML(basse)}</span>
                            </div>
                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-darkBg/50 border border-slate-200 dark:border-borderCol/70">
                                <span class="block text-xs font-semibold uppercase text-slate-400 mb-1">Clavier</span>
                                <span class="text-base md:text-lg font-bold text-slate-900 dark:text-white">${escapeHTML(clavier)}</span>
                            </div>
                        </div>
                    </div>

                    ${commentairesHtml}
                    ${setlistHtml}
                </div>
            `;

            document.getElementById("planningView").classList.add("hidden");
            document.getElementById("detailView").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeSessionDetail() {
            document.getElementById("detailView").classList.add("hidden");
            document.getElementById("planningView").classList.remove("hidden");
        }

        function toggleSort(colIndex) {
            const existingIndex = activeSorts.findIndex(s => s.col === colIndex);
            if (existingIndex !== -1) {
                activeSorts[existingIndex].asc = !activeSorts[existingIndex].asc;
            } else {
                activeSorts.push({ col: colIndex, asc: true });
            }
            applySortsAndRender();
        }

        function removeSort(event, colIndex) {
            event.stopPropagation();
            activeSorts = activeSorts.filter(s => s.col !== colIndex);
            filterData();
        }

        function clearAllSorts() {
            activeSorts = [];
            filterData();
        }

        function applySortsAndRender() {
            if (activeSorts.length > 0) {
                currentFilteredData.sort((a, b) => {
                    for (const sortRule of activeSorts) {
                        const col = sortRule.col;
                        let valA = a[col] || "";
                        let valB = b[col] || "";

                        if (col === 0) {
                            valA = parseRealDate(valA);
                            valB = parseRealDate(valB);
                        } else {
                            valA = removeAccents(valA);
                            valB = removeAccents(valB);
                        }

                        if (valA < valB) return sortRule.asc ? -1 : 1;
                        if (valA > valB) return sortRule.asc ? 1 : -1;
                    }
                    return 0;
                });
            }
            renderTable(currentFilteredData);
        }

        function filterData() {
            const musician = document.getElementById("filterMusician").value.toLowerCase();
            const selectedMonth = document.getElementById("filterMonth").value;
            const selectedYear = document.getElementById("filterYear").value;
            const rawSearch = document.getElementById("searchInput").value.trim();
            
            const searchWords = rawSearch ? removeAccents(rawSearch).split(/\s+/) : [];

            currentFilteredData = allData.filter(row => {
                const dateVal = row[0];
                const dateInfo = parseDateInfo(dateVal);

                const matchMusician = musician === "tous" || row.slice(1, 7).some(cell => removeAccents(cell).includes(removeAccents(musician)));
                const matchMonth = selectedMonth === "Tous" || dateInfo.month === selectedMonth;
                const matchYear = selectedYear === "Toutes" || dateInfo.year === selectedYear;
                
                const matchSearch = searchWords.length === 0 || row.slice(0, 11).some(cell => {
                    const cleanCell = removeAccents(cell);
                    return searchWords.every(word => cleanCell.includes(word));
                });

                return matchMusician && matchMonth && matchYear && matchSearch;
            });

            applySortsAndRender();
        }

        document.getElementById("filterMusician").addEventListener("change", filterData);
        document.getElementById("filterMonth").addEventListener("change", filterData);
        document.getElementById("filterYear").addEventListener("change", filterData);
        document.getElementById("searchInput").addEventListener("input", filterData);

        initTheme();
        loadSheetData();
    </script>
</body>
</html>
