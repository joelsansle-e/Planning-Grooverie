<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Jam Sessions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderCol: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- En-tête -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Planning des Jam Sessions</h1>
            <p class="text-slate-400 text-sm">v19</p>
        </header>

        <!-- Filtres -->
        <div class="bg-cardBg border border-borderCol rounded-xl p-4 md:p-6 mb-6 shadow-lg flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center w-full md:w-auto">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Musicien</label>
                    <select id="filterMusician" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Tous">Tous les musiciens</option>
                        <option value="Nas">Nas</option>
                        <option value="Shan">Shan</option>
                        <option value="Mat">Mat</option>
                        <option value="Flo">Flo</option>
                        <option value="Tony">Tony</option>
                        <option value="Jo">Jo</option>
                        <option value="Célia">Célia</option>
                        <option value="Lauralyn">Lauralyn</option>
                        <option value="Rhodes">Rhodes</option>
                        <option value="Félix">Félix</option>
                        <option value="Obed">Obed</option>
                        <option value="PL">PL</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Mois</label>
                    <select id="filterMonth" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Tous">Tous les mois</option>
                        <option value="01">Janvier</option>
                        <option value="02">Février</option>
                        <option value="03">Mars</option>
                        <option value="04">Avril</option>
                        <option value="05">Mai</option>
                        <option value="06">Juin</option>
                        <option value="07">Juillet</option>
                        <option value="08">Août</option>
                        <option value="09">Septembre</option>
                        <option value="10">Octobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Décembre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Année</label>
                    <select id="filterYear" class="bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Toutes">Toutes les années</option>
                    </select>
                </div>
            </div>
            <div class="w-full md:w-auto flex-1 max-w-xs">
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Recherche</label>
                <input type="text" id="searchInput" placeholder="Filtrer par mot-clé..." class="w-full bg-darkBg border border-borderCol text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- Tableau des données avec hauteur max et scroll -->
        <div class="bg-cardBg border border-borderCol rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto max-h-[75vh] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 z-10">
                        <tr class="bg-slate-900 border-b border-borderCol text-slate-200 text-xs uppercase tracking-wider text-center shadow-md">
                            <th class="p-4 font-semibold bg-slate-900">Date</th>
                            <th class="p-4 font-semibold bg-slate-900">Cachet 1</th>
                            <th class="p-4 font-semibold bg-slate-900">Cachet 2</th>
                            <th class="p-4 font-semibold bg-slate-900">Chant</th>
                            <th class="p-4 font-semibold bg-slate-900">Drums</th>
                            <th class="p-4 font-semibold bg-slate-900">Basse</th>
                            <th class="p-4 font-semibold bg-slate-900">Clavier</th>
                            <th class="p-4 font-semibold bg-slate-900">Commentaires</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-borderCol text-sm text-center">
                        <tr>
                            <td colspan="8" class="p-8 text-slate-400 text-center">Chargement des données du planning...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1EgkCv-Qn9tqAoZNuWedt0P-i3yUZHi_U2iVEV0QIr14/gviz/tq?tqx=out:csv&sheet=Planning_Master";

        let allData = [];

        function removeAccents(str) {
            if (!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function getMusicianBadge(cellValue) {
            if (!cellValue || cellValue.trim() === "") return "";
            
            const mainNamePart = cellValue.split('(')[0].trim().toLowerCase();
            
            let bgClass = "bg-red-950 text-red-200 border border-red-700";

            if (mainNamePart.includes("nas")) bgClass = "bg-purple-900 text-purple-200 border border-purple-500";
            else if (mainNamePart.includes("shan")) bgClass = "bg-amber-400 text-slate-950 font-bold";
            else if (mainNamePart.includes("mat")) bgClass = "bg-orange-600 text-white font-bold";
            else if (mainNamePart.includes("flo")) bgClass = "bg-cyan-700 text-cyan-100";
            else if (mainNamePart.includes("tony")) bgClass = "bg-rose-700 text-rose-100";
            else if (mainNamePart.includes("jo")) bgClass = "bg-emerald-600 text-emerald-50 font-bold";

            return `<span class="px-2.5 py-1 rounded-md text-xs inline-block ${bgClass}">${cellValue}</span>`;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Erreur de chargement:", error);
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="8" class="p-8 text-rose-400 text-center">Erreur lors du chargement des données du Google Sheet. Vérifiez le partage public.</td></tr>`;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => {
                const row = [];
                let inQuotes = false, current = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(current.trim()); current = ''; }
                    else current += char;
                }
                row.push(current.trim());
                return row;
            });

            if (lines.length > 1) {
                allData = lines.slice(1).filter(row => row.length >= 8 && row[0] !== "");
                populateYearFilter();
                setDefaultCurrentMonth();
                filterData();
            } else {
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="8" class="p-8 text-slate-400 text-center">Aucune donnée trouvée dans le tableau.</td></tr>`;
            }
        }

        function populateYearFilter() {
            const years = [...new Set(allData.map(row => {
                const dateVal = row[0];
                const match = dateVal.match(/\b(20\d{2})\b/);
                return match ? match[1] : null;
            }).filter(Boolean))].sort();

            const yearSelect = document.getElementById("filterYear");
            yearSelect.innerHTML = '<option value="Toutes">Toutes les années</option>';
            years.forEach(y => {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            });

            const currentYear = new Date().getFullYear().toString();
            if (years.includes(currentYear)) {
                yearSelect.value = currentYear;
            }
        }

        function setDefaultCurrentMonth() {
            // Sélectionne automatiquement le mois en cours (ex: "11" pour novembre)
            const currentMonthNum = String(new Date().getMonth() + 1).padStart(2, '0');
            const monthSelect = document.getElementById("filterMonth");
            monthSelect.value = currentMonthNum;
        }

        function parseDateInfo(dateStr) {
            if (!dateStr) return { month: "", year: "" };
            
            const yearMatch = dateStr.match(/\b(20\d{2})\b/);
            const year = yearMatch ? yearMatch[1] : "";

            let month = "";
            const monthsMap = {
                "janvier": "01", "février": "02", "fevrier": "02", "mars": "03", 
                "avril": "04", "mai": "05", "juin": "06", "juillet": "07", 
                "août": "08", "aout": "08", "septembre": "09", "octobre": "10", 
                "novembre": "11", "décembre": "12", "decembre": "12"
            };

            const lowerDate = dateStr.toLowerCase();
            for (const [name, num] of Object.entries(monthsMap)) {
                if (lowerDate.includes(name)) {
                    month = num;
                    break;
                }
            }

            if (!month) {
                const parts = dateStr.split(/[\/\-\.]/);
                if (parts.length >= 3) {
                    if (parts[0].length === 4 && parts[1].length <= 2) {
                        month = parts[1].padStart(2, '0');
                    } else if (parts[2].length === 4 && parts[1].length <= 2) {
                        month = parts[1].padStart(2, '0');
                    }
                }
            }

            return { month, year };
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-slate-400 text-center">Aucune session correspondante.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(row => {
                const date = row[0] || "";
                let cachet1 = row[1] || "";
                let cachet2 = row[2] || "";
                const net1 = row[8] || ""; 
                const net2 = row[9] || ""; 
                const chant = row[3] || "";
                const drums = row[4] || "";
                const basse = row[5] || "";
                const clavier = row[6] || "";
                let commentaires = row[7] || "/";
                if (commentaires.trim() === "") commentaires = "/";

                if (net1.trim() !== "") cachet1 += ` (${net1})`;
                if (net2.trim() !== "") cachet2 += ` (${net2})`;

                return `
                    <tr class="hover:bg-slate-800/50 transition-colors">
                        <td class="p-4 font-medium text-white">${date}</td>
                        <td class="p-4">${getMusicianBadge(cachet1)}</td>
                        <td class="p-4">${getMusicianBadge(cachet2)}</td>
                        <td class="p-4 text-slate-300">${chant}</td>
                        <td class="p-4 text-slate-300">${drums}</td>
                        <td class="p-4 text-slate-300">${basse}</td>
                        <td class="p-4 text-slate-300">${clavier}</td>
                        <td class="p-4 text-slate-400 italic">${commentaires}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterData() {
            const musician = document.getElementById("filterMusician").value.toLowerCase();
            const selectedMonth = document.getElementById("filterMonth").value;
            const selectedYear = document.getElementById("filterYear").value;
            const rawSearch = document.getElementById("searchInput").value.trim();
            
            const searchWords = rawSearch ? removeAccents(rawSearch).split(/\s+/) : [];

            const filtered = allData.filter(row => {
                const rowString = removeAccents(row.join(" "));
                const dateVal = row[0];
                const dateInfo = parseDateInfo(dateVal);

                const matchMusician = musician === "tous" || row.slice(1, 7).some(cell => removeAccents(cell).includes(removeAccents(musician)));
                const matchMonth = selectedMonth === "Tous" || dateInfo.month === selectedMonth;
                const matchYear = selectedYear === "Toutes" || dateInfo.year === selectedYear;
                const matchSearch = searchWords.every(word => rowString.includes(word));

                return matchMusician && matchMonth && matchYear && matchSearch;
            });

            renderTable(filtered);
        }

        document.getElementById("filterMusician").addEventListener("change", filterData);
        document.getElementById("filterMonth").addEventListener("change", filterData);
        document.getElementById("filterYear").addEventListener("change", filterData);
        document.getElementById("searchInput").addEventListener("input", filterData);

        loadSheetData();
    </script>
</body>
</html>
